<p>servers works!</p>
<div class="container">
  <div class="row">
    <div class="col-xs-12">
      <button
        (click)="changeStatus()"
        class="btn m-3"
        [ngClass]="getButtonClass"
      >
        {{ status }}
      </button>
      <app-warning-alert />
      <p>{{ isWarning }}</p>
      <app-success-alert />
      <p>{{ isSuccess }}</p>

      <h2>{{ status }}</h2>
    </div>
  </div>
</div>
