<p class="text-2xl font-bold mb-6 text-gray-800">Get API Response!</p>

<div class="overflow-x-auto">
  <table class="min-w-full border border-gray-300 rounded-lg shadow-md">
    <!-- Table Head -->
    <thead class="bg-gray-800 text-white">
      <tr>
        <th class="px-6 py-3 text-left text-sm font-semibold uppercase tracking-wider">User ID</th>
        <th class="px-6 py-3 text-left text-sm font-semibold uppercase tracking-wider">ID</th>
        <th class="px-6 py-3 text-left text-sm font-semibold uppercase tracking-wider">Title</th>
        <th class="px-6 py-3 text-left text-sm font-semibold uppercase tracking-wider">
          Completed
        </th>
      </tr>
    </thead>

    <!-- Table Body -->
    <tbody class="bg-white divide-y divide-gray-200">
      @for (item of todoList; track $index) {
        <tr class="hover:bg-gray-100 transition duration-200">
          <td class="px-6 py-4 text-sm text-gray-700">{{ item.userId }}</td>
          <td class="px-6 py-4 text-sm text-gray-700">{{ item.id }}</td>
          <td class="px-6 py-4 text-sm text-gray-700">{{ item.title }}</td>
          <td class="px-6 py-4 text-sm text-gray-700">{{ item.body }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
