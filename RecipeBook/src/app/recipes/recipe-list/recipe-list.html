<div class="row">
  <div class="col-12 mb-3">
    <button class="btn btn-success">New Recipe</button>
  </div>
</div>
<hr />
<div class="row">
  <div class="col-md-7">
    @for (recipe of recipes; track recipe.name) {
      <app-recipe-item [recipe]="recipe" (recipeSelected)="onRecipeSelected(recipe)" />
    }
  </div>
</div>
