<a href="#" (click)="onSelect()" class="list-group-item list-group-item-action mb-2">
  <div class="d-flex justify-content-between align-items-center border p-2 bg-body-secondary">
    <div>
      <h4>{{ recipe.name }}</h4>
      <p>{{ recipe.description }}</p>
    </div>

    <img
      [src]="recipe.imagePath"
      [alt]="recipe.name"
      class="img-fluid rounded"
      style="max-height: 70px"
    />
  </div>
</a>
